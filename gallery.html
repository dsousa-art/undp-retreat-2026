<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resort Gallery</title>

    <link rel="stylesheet" href="style.css">

    <style>
        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding-top: 20px;
        }

        .gallery img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            border-radius: 12px;
            box-shadow: 0 4px 12px rgba(0, 0, 0, .1);
            transition: 0.3s;
        }

        .gallery img:hover {
            transform: scale(1.03);
        }

        .gallery-title {
            text-align: center;
            color: #004b87;
            margin-bottom: 30px;
        }
    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            UNDP Retreat 2026
        </div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="agenda.html">Programme</a>
            <a href="travel.html">Travel</a>
            <a href="accommodation.html">Venue</a>
            <a href="gallery.html">Gallery</a>
            <a href="downloads.html">Downloads</a>
            <a href="contacts.html">Contacts</a>
        </div>

    </nav>

    <section class="section">

        <h1 class="gallery-title">Badplaas Forever Resort Gallery</h1>

        <div class="gallery">

            <img src="gallery1.jpg" alt="Resort Photo 1">

            <img src="gallery2.jpg" alt="Resort Photo 2">

            <img src="gallery3.jpg" alt="Resort Photo 3">

            <img src="gallery4.jpg" alt="Resort Photo 4">

            <img src="gallery5.jpg" alt="Resort Photo 5">

            <img src="gallery6.jpg" alt="Resort Photo 6">

        </div>

    </section>

</body>

</html>
